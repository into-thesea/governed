# Governed 工业级基础设施编排
# 包含：Milvus（长期向量记忆）、Kafka（链路追踪/审计）、MinIO（VFS 文件存储）
# 另含可选：PostgreSQL（多数据源 + pgvector 长期记忆）、MySQL（多数据源）
# 使用：docker compose up -d

services:
  # ============================================================
  # Milvus —— 长期向量记忆（向量相似度检索）
  # 依赖：etcd（元数据）、minio（对象存储）
  # ============================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: governed-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: governed-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: governed-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

  # ============================================================
  # Kafka + Zookeeper —— 审计日志、链路追踪、事件总线
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: governed-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: governed-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Kafka UI（可选，方便查看 topic 和消息）
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: governed-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: governed
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # ============================================================
  # PostgreSQL / MySQL —— C5 多数据源（首期 SQLAlchemy + MySQL/PG）
  #
  # 端口故意用非常规值（55432 / 53306）：本机常有别的项目占用 5432/3306，
  # 撞端口会连到别人的库上，排查起来很贵。
  # 两个库都只建**只读账号** harness_ro（见 infra/db/*.sql）——
  # 「写入必须失败」由测试实测，不靠假设。
  # ============================================================
  postgres:
    # pgvector 官方镜像：长期记忆的默认向量后端需要 vector 扩展，
    # 官方 postgres 镜像不含它。
    image: pgvector/pgvector:pg16
    container_name: governed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness_admin
      POSTGRES_PASSWORD: harness_admin_pw
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness_admin -d harness"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8
    container_name: governed-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: harness_root_pw
      MYSQL_DATABASE: harness
    ports:
      - "53306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pharness_root_pw"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ============================================================
  # Redis —— 共享状态层（P0-1：分布式限流 + 可选会话缓存）
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: governed-redis
    restart: unless-stopped
    ports:
      # 宿主 16379 避免与其他项目的 redis（6379）冲突；容器内仍为 6379。
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # 沙箱控制面 —— OpenSandbox Server（code_executor 高危代码的隔离层）
  #
  # 拓扑（Docker-out-of-Docker，而非容器内再装 Docker）：
  #   sandbox 容器挂宿主 /var/run/docker.sock，由「宿主机 daemon」动态拉起
  #   execd / egress sidecar 与 governed-sandbox 执行容器；沙箱以 bridge +
  #   宿主端口(40000-60000)暴露，host_ip=host.docker.internal 让返回给 SDK
  #   的端点可从 governed 容器经 host-gateway 回连（见 sandbox.container.toml）。
  # ============================================================
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox-server
    image: governed-sandbox-server:latest
    container_name: governed-sandbox-server
    restart: unless-stopped
    environment:
      # 与 governed 的 SANDBOX_API_KEY 必须一致（默认值仅用于本地一键体验）
      OPENSANDBOX_SERVER_API_KEY: ${SANDBOX_API_KEY:-governed-local-dev-key}
    volumes:
      # 关键：经宿主 daemon 拉起沙箱容器（DooD）
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opensandbox-server/sandbox.container.toml:/app/sandbox.toml:ro
      - sandbox_state:/app/state
    ports:
      # 仅为宿主调试；容器内 8080 的宿主映射已被 kafka-ui 占用，故用 18080。
      # governed 在 compose 网络内直接连 http://sandbox:8080，不经此映射。
      - "18080:8080"
    extra_hosts:
      # Linux 宿主提供 host.docker.internal 解析；Docker Desktop 自带、该项无害
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 镜像零 apt 无 curl，用 Python 自带 urllib 探测
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # 沙箱「执行镜像」构建载体：产出 governed-sandbox:latest（pandas/numpy 运行时），
  # 供 sandbox 控制面经宿主 daemon 拉起、在其中跑用户分析代码。本服务不常驻，
  # 仅借 compose 的构建阶段产出镜像，启动后 echo 即退出（Exited 0 属预期）。
  sandbox-runtime:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: governed-sandbox:latest
    container_name: governed-sandbox-runtime-builder
    restart: "no"
    command: ["echo", "governed-sandbox runtime image built; not a running service"]

  # ============================================================
  # Governed 应用 —— Agent 管控运行时（FastAPI + LangGraph）
  # 首次使用前：cp .env.example .env 并填入 API Key
  # 构建：docker compose build governed
  # 启动：docker compose up -d governed
  # ============================================================
  governed:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: governed-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # 容器网络内用 service name 代替 127.0.0.1
      MEMORY_PG_DSN: postgresql://harness_admin:harness_admin_pw@postgres:5432/harness
      DATASOURCE_SOURCES: '{"pg_dev":"postgresql+psycopg://harness_ro:harness_ro_pw@postgres:5432/harness","mysql_dev":"mysql+pymysql://harness_ro:harness_ro_pw@mysql:3306/harness"}'
      # P0-1 共享状态层：Redis 分布式限流
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      # 沙箱控制面在同 compose 网络内；控制面走服务名，沙箱数据面由控制面
      # 通告为 host.docker.internal:宿主端口（见 sandbox 的 host_ip 配置）
      SANDBOX_SERVER_URL: http://sandbox:8080
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-governed-local-dev-key}
      # Kafka / MinIO / Milvus 容器网络地址
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MILVUS_HOST: milvus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    extra_hosts:
      # 回连沙箱数据面（宿主映射端口 40000-60000）；Docker Desktop 自带、该项无害
      - "host.docker.internal:host-gateway"
    volumes:
      - governed_data:/app/data
    healthcheck:
      # 镜像零 apt 无 curl，用 Python 自带 urllib 探测
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  zk_data:
  zk_log:
  kafka_data:
  pg_data:
  mysql_data:
  redis_data:
  governed_data:
  sandbox_state:
