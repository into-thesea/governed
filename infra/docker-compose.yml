# Governed 工业级基础设施编排
# 包含：Milvus（长期向量记忆）、Kafka（链路追踪/审计）、MinIO（VFS 文件存储）
# 另含可选：PostgreSQL（多数据源 + pgvector 长期记忆）、MySQL（多数据源）
# 使用：docker-compose up -d

version: "3.8"

services:
  # ============================================================
  # Milvus —— 长期向量记忆（向量相似度检索）
  # 依赖：etcd（元数据）、minio（对象存储）
  # ============================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: governed-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: governed-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: governed-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

  # ============================================================
  # Kafka + Zookeeper —— 审计日志、链路追踪、事件总线
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: governed-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: governed-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Kafka UI（可选，方便查看 topic 和消息）
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: governed-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: governed
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # ============================================================
  # PostgreSQL / MySQL —— C5 多数据源（首期 SQLAlchemy + MySQL/PG）
  #
  # 端口故意用非常规值（55432 / 53306）：本机常有别的项目占用 5432/3306，
  # 撞端口会连到别人的库上，排查起来很贵。
  # 两个库都只建**只读账号** harness_ro（见 infra/db/*.sql）——
  # 「写入必须失败」由测试实测，不靠假设。
  # ============================================================
  postgres:
    # pgvector 官方镜像：长期记忆的默认向量后端需要 vector 扩展，
    # 官方 postgres 镜像不含它。
    image: pgvector/pgvector:pg16
    container_name: governed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness_admin
      POSTGRES_PASSWORD: harness_admin_pw
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness_admin -d harness"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8
    container_name: governed-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: harness_root_pw
      MYSQL_DATABASE: harness
    ports:
      - "53306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pharness_root_pw"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ============================================================
  # Redis —— 共享状态层（P0-1：分布式限流 + 可选会话缓存）
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: governed-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # Governed 应用 —— Agent 管控运行时（FastAPI + LangGraph）
  # 首次使用前：cp .env.example .env 并填入 API Key
  # 构建：docker compose build governed
  # 启动：docker compose up -d governed
  # ============================================================
  governed:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: governed-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # 容器网络内用 service name 代替 127.0.0.1
      MEMORY_PG_DSN: postgresql://harness_admin:harness_admin_pw@postgres:5432/harness
      DATASOURCE_SOURCES: '{"pg_dev":"postgresql+psycopg://harness_ro:harness_ro_pw@postgres:5432/harness","mysql_dev":"mysql+pymysql://harness_ro:harness_ro_pw@mysql:3306/harness"}'
      # P0-1 共享状态层：Redis 分布式限流
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      # 沙箱服务端默认跑在宿主上（Docker-in-Docker 复杂，见 infra/opensandbox-server/）
      # 若沙箱也容器化，改为 http://sandbox:8080
      SANDBOX_SERVER_URL: http://host.docker.internal:8080
      # Kafka / MinIO / Milvus 容器网络地址
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MILVUS_HOST: milvus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - governed_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  zk_data:
  zk_log:
  kafka_data:
  pg_data:
  mysql_data:
  redis_data:
  governed_data:
